# Build gate for pull requests against main

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fitness
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d fitness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DB_URL: jdbc:postgresql://localhost:5432/fitness
      DB_USERNAME: ci
      DB_PASSWORD: ci
      # Throwaway value (HS512 needs at least 64 bytes)
      JWT_SECRET: ci-only-secret-not-used-outside-this-workflow-padded-to-64-bytes
      SPRING_PROFILES_ACTIVE: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # mvnw is committed without the executable bit, so it cannot be run directly.
      - name: Build and test
        run: sh mvnw -B verify

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        # shared/api/backend.ts throws at import time when this is unset; the
        # real value is injected at runtime by compose.
        env:
          SPRING_API_BASE_URL: http://placeholder.invalid
        run: npm run build
