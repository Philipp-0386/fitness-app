# Production overlay: no published app ports, Caddy terminates TLS.
# Used on the server via COMPOSE_FILE=compose.yaml:compose.prod.yaml

# All container logs go to journald; retention is configured on the host.
# LOG_DRIVER=json-file only for running this overlay locally, where journald is missing.
x-logging: &journald
  logging:
    driver: ${LOG_DRIVER:-journald}

services:
  db:
    <<: *journald

  backend:
    <<: *journald
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SEED_ADMIN_PASSWORD_HASH: ${SEED_ADMIN_PASSWORD_HASH:?bcrypt hash for the seeded admin account}
      SEED_USER_PASSWORD_HASH: ${SEED_USER_PASSWORD_HASH:?bcrypt hash for the seeded user account}

  frontend:
    <<: *journald

  caddy:
    <<: *journald
    profiles: ["full"]
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
