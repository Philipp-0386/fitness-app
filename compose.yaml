# Root compose file for the whole stack. See README.md for setup and usage.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Runs only on first initialisation of an empty data directory.
      - ./db/src/main.sql:/docker-entrypoint-initdb.d/main.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces a TCP check: during initdb the server listens on the
      # unix socket only, so a socket-based pg_isready would report healthy too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    profiles: ["full"]
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
    environment:
      # Service name, not localhost: the request leaves the frontend container.
      SPRING_API_BASE_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  backend-logs:
