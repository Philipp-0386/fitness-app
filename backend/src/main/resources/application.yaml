spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: 120
    refresh-token-expiration-days: 7

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false} # exposes the full api
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
  paths-to-match: /backend/**

logging:
  file:
    name: logs/fitness-app.log
