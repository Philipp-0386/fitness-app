services:
  postgres-db:
    image: postgres:17
    environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      # Runs only on first initialisation of an empty data directory
      - ./src/main.sql:/docker-entrypoint-initdb.d/main.sql:ro
